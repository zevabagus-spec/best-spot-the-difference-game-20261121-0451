<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lanternlight Twins — a spot-the-difference hunt</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1026; }
  #stage { position: fixed; inset: 0; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud-toast {
    position: absolute; left: 50%; bottom: 9%; transform: translateX(-50%);
    padding: 8px 18px; border-radius: 999px; background: rgba(20, 26, 56, 0.92);
    color: #ffe9a8; font: bold 19px 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif;
    border: 2px solid #f4c95d; opacity: 0; transition: opacity 0.25s; pointer-events: none;
    white-space: nowrap;
  }
  #controls {
    position: absolute; right: 1.2%; bottom: 1.6%; display: flex; gap: 8px;
  }
  #controls button {
    font: bold 15px 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif;
    color: #1d2333; background: #ffd166; border: none; border-radius: 8px;
    padding: 8px 12px; cursor: pointer;
  }
  #controls button:hover { background: #ffe9a8; }
  #controls button:disabled { background: #5a5f7a; color: #c9cde0; cursor: default; }
  #controls button.ghost { background: #2a335e; color: #e8ecff; }
  #controls button.ghost:hover { background: #39406e; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* HUD text mirrors, kept for scripts and assistive tech; the canvas paints the visible HUD. */
  .hud-mirror { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" aria-label="Lanternlight Twins: spot the difference between Picture A and Picture B"></canvas>
  <div id="hud-toast" role="status"></div>
  <div id="controls">
    <button id="btn-hint" type="button">Hint (H)</button>
    <button id="btn-pause" type="button" class="ghost">Pause (P)</button>
    <button id="btn-restart" type="button" class="ghost">Restart (R)</button>
    <button id="btn-menu" type="button" class="ghost">Menu</button>
    <button id="btn-mute" type="button" class="ghost">Mute (M)</button>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
  <span id="hud-level" class="hud-mirror"></span>
  <span id="hud-timer" class="hud-mirror"></span>
  <span id="hud-score" class="hud-mirror"></span>
  <span id="hud-hints" class="hud-mirror"></span>
  <span id="hud-counter" class="hud-mirror"></span>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
